name: WS-01 Apply One House Integration

on:
  push:
    branches:
      - ws-01-one-house-shell

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply WS-01 integration migration
        run: node scripts/apply-ws01-integration.mjs
      - name: Commit generated integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add context-bridge.js roundtable.js roundtable.html README.md README.ja.md
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "WS-01: integrate selected Project across browser rooms"
            git push origin HEAD:ws-01-one-house-shell
          fi
