name: Human Agency Core

on:
  push:
    branches:
      - architecture/human-agency-v0.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Human Agency Core tests
        run: node --test tests/human-agency-core.test.mjs
