name: Human Agency Core

on:
  push:
    branches:
      - main
      - architecture/**
      - mc-*
      - cb-*
      - rt-*
      - hg-*
      - ws-*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Human Agency tests
        run: node --test tests/*.test.mjs
